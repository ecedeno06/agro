<button
  *ngIf="!ocultarDisparador"
  type="button"
  class="selector-foto-btn"
  [class.selector-foto-btn-static]="soloLectura"
  [title]="soloLectura ? nombre : titulo"
  [style.width.px]="tamano"
  [style.height.px]="tamano"
  (click)="abrirSelector()"
>
  <img *ngIf="foto" [src]="foto" class="selector-foto-img" [alt]="titulo" [style.width.px]="tamano" [style.height.px]="tamano" />
  <div
    *ngIf="!foto"
    class="selector-foto-avatar"
    [class.selector-foto-avatar--cuadrado]="cuadrado"
    [style.width.px]="tamano"
    [style.height.px]="tamano"
    [style.font-size.px]="tamano * 0.28"
  >{{ iniciales() }}</div>
  <span *ngIf="!soloLectura" class="selector-foto-camera">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></svg>
  </span>
</button>

<div class="selector-foto-overlay" *ngIf="mostrarSelector()">
  <div class="selector-foto-modal">
    <div class="selector-foto-header">
      <h2>Foto</h2>
      <button type="button" class="selector-foto-close" (click)="cerrarSelector()">✕</button>
    </div>

    <div class="selector-foto-opciones" *ngIf="!capturandoCamara()">
      <button type="button" class="action-btn" (click)="iniciarCamara()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></svg>
        Usar cámara
      </button>
      <button type="button" class="action-btn" (click)="elegirArchivo()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Buscar en el equipo
      </button>
      <div class="selector-foto-paste" tabindex="0" (paste)="onPasteFoto($event)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
        <span>Haz clic aquí y presiona Ctrl+V para pegar una imagen</span>
      </div>
      <input #fileInputFoto type="file" accept="image/*" style="display:none" (change)="onArchivoSeleccionado($event)" />
      <button type="button" class="action-btn cancel-btn" *ngIf="foto" (click)="eliminarFoto()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        Eliminar foto
      </button>
    </div>

    <div *ngIf="capturandoCamara()">
      <div class="selector-foto-video-wrap">
        <video #videoFoto autoplay playsinline class="selector-foto-video"></video>
        <button
          *ngIf="hayVariasCamaras()"
          type="button"
          class="selector-foto-flip"
          title="Cambiar de cámara"
          aria-label="Cambiar de cámara"
          (click)="cambiarCamara()"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
      </div>
      <div class="selector-foto-camara-actions">
        <button type="button" class="action-btn save-btn" (click)="capturarFoto()">Capturar</button>
        <button type="button" class="action-btn cancel-btn" (click)="detenerCamara()">Cancelar</button>
      </div>
    </div>
  </div>
</div>
